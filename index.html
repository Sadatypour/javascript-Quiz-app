<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body onload="load()">
    <div class="container">
        <div class="image_home">
            <img class="image_home" src="./images/rememberpng.png" alt="">
        </div>
        <div class="box_quiz">
            <div class="quiz">
                <div class="heder_quiz">
                    <p>انسان چند دندان دارد؟</p>
                    <div class="list">
                        <ol class="list_answer">
                            <li class="li 1  ">5 دندان</li>
                            <li class="li 2  ">10 دندان</li>
                            <li class="li 3  ">20 دندان</li>
                            <li class="li 4  ">32 دندان</li>
                        </ol>
                    </div>

                </div>
            </div>
            <div class="btn">
                <button class="finall" disabled>نتیجه</button>
                <button class="next">سوال بعدی</button>

            </div>

        </div>
    </div>

    <script src="./js/app.js"></script>
</body>

</html>
